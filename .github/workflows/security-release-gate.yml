name: Security release gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: New immutable numeric tag; empty runs verification only
        required: false
        default: ''
        type: string
  push:
    branches:
      - 'verification/flat-cni-ipam-*'

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: flat-cni-ipam-security-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-and-product:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GO_VERSION: 1.27.3
      GO_LINUX_AMD64_SHA256: 65efbc80fdc1fa2cd2631cad5b481777a68e8725f34e89f50fc6ac714e379b40
      GOVULNCHECK_VERSION: v1.6.0
      VERSION_OVERRIDE: 0.1.6

    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install verified Go toolchain
        shell: bash
        run: |
          set -euo pipefail
          archive="go${GO_VERSION}.linux-amd64.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --output "/tmp/${archive}" "https://go.dev/dl/${archive}"
          printf '%s  %s\n' "$GO_LINUX_AMD64_SHA256" "/tmp/${archive}" | sha256sum -c -
          sudo rm -rf /usr/local/go
          sudo tar -C /usr/local -xzf "/tmp/${archive}"
          printf '/usr/local/go/bin\n%s/bin\n' "$(go env GOPATH)" >> "$GITHUB_PATH"

      - name: Validate source contract
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          ./scripts/validate
          # v0.1.3 is on a parallel modernization lineage; both retain v0.1.0.
          git merge-base --is-ancestor v0.1.0 HEAD
          test "$(git rev-list --count v0.1.0..HEAD)" -ge 1

      - name: Test race detector and coverage gates
        shell: bash
        run: |
          set -euo pipefail
          go test -race ./... -count=1
          go test . -coverprofile=/tmp/root.out -count=1
          go test ./ipfinder/metadata -coverprofile=/tmp/metadata.out -count=1
          root_coverage=$(go tool cover -func=/tmp/root.out | awk '/^total:/ {gsub("%", "", $3); print $3}')
          metadata_coverage=$(go tool cover -func=/tmp/metadata.out | awk '/^total:/ {gsub("%", "", $3); print $3}')
          awk -v value="$root_coverage" 'BEGIN { exit !(value >= 80) }'
          awk -v value="$metadata_coverage" 'BEGIN { exit !(value >= 85) }'
          printf 'root_coverage=%s%%\nmetadata_coverage=%s%%\n' "$root_coverage" "$metadata_coverage"

      - name: Scan reachable Go vulnerabilities
        shell: bash
        run: |
          set -euo pipefail
          GOBIN="$RUNNER_TEMP/bin" go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          "$RUNNER_TEMP/bin/govulncheck" -show version ./...

      - name: Validate manual release request
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$RELEASE_TAG" = 'v0.1.6'
          test -z "$(git status --porcelain --untracked-files=no)"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
          tags="$(gh api --paginate "repos/$GITHUB_REPOSITORY/tags" --jq '.[].name')"
          if grep -Fxq "$RELEASE_TAG" <<<"$tags"; then
            echo 'The release tag already exists; refusing to overwrite it' >&2
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs" --jq '
            [.check_runs[] | select(.name == "Analyze (go)" or .name == "Analyze (actions)")]
            | group_by(.name) | length == 2 and all(any(.conclusion == "success"))' | grep -Fx true

      - name: Verify reproducible Linux product
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/product-a /tmp/product-b evidence
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -buildvcs=false \
            -ldflags "-buildid= -X main.buildVersion=${VERSION_OVERRIDE} -s -w" \
            -o /tmp/product-a/flat-cni-ipam .
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -buildvcs=false \
            -ldflags "-buildid= -X main.buildVersion=${VERSION_OVERRIDE} -s -w" \
            -o /tmp/product-b/flat-cni-ipam .
          cmp /tmp/product-a/flat-cni-ipam /tmp/product-b/flat-cni-ipam
          sha256sum /tmp/product-a/flat-cni-ipam > evidence/flat-cni-ipam.sha256
          go version -m /tmp/product-a/flat-cni-ipam > evidence/product-go-version.txt
          grep -F 'go1.27.3' evidence/product-go-version.txt >/dev/null
          grep -F $'dep\tgithub.com/containernetworking/cni\tv1.3.0' evidence/product-go-version.txt >/dev/null
          grep -F $'dep\tgithub.com/vishvananda/netns\tv0.0.5' evidence/product-go-version.txt >/dev/null
          grep -F $'dep\tgolang.org/x/sys\tv0.47.0' evidence/product-go-version.txt >/dev/null

      - name: Scan and inventory the actual product
        env:
          TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v /tmp/product-a:/product:ro -v "$PWD/evidence:/evidence" \
            "$TRIVY_IMAGE" rootfs --scanners vuln,secret --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            --exit-code 0 --format json --output /evidence/product-security.json /product
          docker run --rm -v /tmp/product-a:/product:ro -v "$PWD/evidence:/evidence" \
            "$TRIVY_IMAGE" rootfs --format cyclonedx --output /evidence/product.cdx.json /product
          PYTHONDONTWRITEBYTECODE=1 python3 .github/scripts/test_runtime_vulnerability_policy.py
          python3 .github/scripts/enforce-runtime-vulnerabilities.py \
            evidence/product-security.json .github/runtime-unfixed.json \
            --repository "$GITHUB_REPOSITORY"

      - name: Upload review evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flat-cni-ipam-security-${{ github.sha }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 30

      - name: Prepare verified release asset
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/release
          cp /tmp/product-a/flat-cni-ipam evidence/release/flat-cni-ipam-v0.1.6-linux-amd64
          (cd evidence/release && sha256sum flat-cni-ipam-v0.1.6-linux-amd64 > SHA256SUMS)
          go version -m evidence/release/flat-cni-ipam-v0.1.6-linux-amd64 | grep -F 'go1.27.3'

      - name: Attest release asset
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: evidence/release/flat-cni-ipam-v0.1.6-linux-amd64

      - name: Publish immutable binary release
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
          tag_sha="$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/tags" \
            -f tag="$RELEASE_TAG" -f object="$GITHUB_SHA" -f type=commit \
            -f message="Security refresh $RELEASE_TAG" --jq .sha)"
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$RELEASE_TAG" -f sha="$tag_sha" >/dev/null
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$RELEASE_TAG" --notes "Go 1.27.3 security rebuild; producer $GITHUB_SHA." \
            evidence/release/flat-cni-ipam-v0.1.6-linux-amd64 evidence/release/SHA256SUMS \
            evidence/product-go-version.txt evidence/*.json
